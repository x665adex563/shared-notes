{% extends "base.html" %}


{% block scripts %}
  {{ super() }}
  <script>
    (() => {
      const applyTheme = () => {
        const setColor = (selector, property, color) => {
          document.querySelectorAll(selector).forEach((element) => {
            element.style.setProperty(property, color, "important");
          });
        };

        // 頂部導覽列
        setColor(".md-header", "background-color", "#665344");

        // 搜尋框
        setColor(".md-search__form", "background-color", "#493b30");

        // 主要頁面
        setColor(
          "body, .md-container, .md-main, .md-content, .md-content__inner",
          "background-color",
          "#d8cbbb"
        );

        // 頁尾
        setColor(".md-footer", "background-color", "#352c25");

        // 主要文字
        setColor(
          ".md-content, .md-content p, .md-content li",
          "color",
          "#393129"
        );

        // 網站標題
        document.querySelectorAll(".md-header__title").forEach((element) => {
          element.classList.add("text-base", "font-semibold");
        });

        // 左右側欄標題
        const navTitles =
          ".md-sidebar--primary .md-nav__title, .md-sidebar--secondary .md-nav__title";

        setColor(navTitles, "background-color", "#665344");
        setColor(navTitles, "color", "#f5f0e6");
        setColor(navTitles, "background-image", "none");
        setColor(navTitles, "box-shadow", "none");

        // 右側目錄連結
        setColor(".md-sidebar--secondary .md-nav__link", "color", "#76563c");

      };

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", applyTheme);
      } else {
        applyTheme();
      }
    })();
  </script>
{% endblock %}
