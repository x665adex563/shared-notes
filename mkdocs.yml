site_name: My Notes
site_url: https://x665adex563.github.io/shared-notes/

theme:
  name: material
  custom_dir: overrides
  language: zh-TW
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest

docs_dir: public

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/css/main.css

extra_javascript:
  - assets/js/main.js
