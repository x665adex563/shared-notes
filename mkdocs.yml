site_name: My Notes
site_url: https://x665adex563.github.io/shared-notes/

theme:
  name: material
  custom_dir: overrides
  language: zh-TW
  features:
    - search.suggest
  palette:
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: 切換至深色模式
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: 切換至淺色模式

docs_dir: public

plugins:
  - search
  - awesome-nav

markdown_extensions:
  - admonition
  - tables
  - nl2br
  - toc:
      permalink: true

extra_css:
  - assets/css/main.css

extra_javascript:
  - assets/js/main.js

hooks:
  - hooks/preserve_blank_lines.py
